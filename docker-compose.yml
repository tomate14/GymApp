services:
  mysql:
    image: mysql:8.4
    container_name: fitexa-mysql
    restart: unless-stopped
    command: ["/bin/sh", "/fitexa-bootstrap/bootstrap.sh"]
    environment:
      MYSQL_DATABASE: fitexa
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - fitexa_mysql_data:/var/lib/mysql
      - ./apps/fitexa/docker/mysql:/fitexa-bootstrap:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql-backup:
    image: mysql:8.4
    container_name: fitexa-mysql-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: America/Buenos_Aires
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: fitexa
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      BACKUP_DIR: /backups/mysql
      RETENTION_COUNT: 4
    command: ["/bin/sh", "/backup/backup-loop.sh"]
    volumes:
      - ./apps/fitexa/docker/mysql/backup-loop.sh:/backup/backup-loop.sh:ro
      - ./backups/mysql:/backups/mysql

  fitexa:
    build:
      context: ./apps/fitexa
      dockerfile: Dockerfile
    container_name: fitexa-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/fitexa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      MACHINE_IMAGES_DIR: /app/data/machine-images
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PUBLIC_BASE_URL: ${MP_PUBLIC_BASE_URL:-http://localhost:8080}
      MP_MOBILE_BASE_URL: ${MP_MOBILE_BASE_URL:-http://localhost:8100}
    ports:
      - "8080:8080"
    volumes:
      - fitexa_machine_images:/app/data/machine-images

  admin-panel:
    build:
      context: ./apps/admin-panel
      dockerfile: Dockerfile
    container_name: gym-admin-panel
    restart: unless-stopped
    depends_on:
      - fitexa
    ports:
      - "4200:80"

  mobile-app:
    build:
      context: ./apps/mobile-app
      dockerfile: Dockerfile
    container_name: gym-mobile-app
    restart: unless-stopped
    depends_on:
      - fitexa
    ports:
      - "8100:80"

volumes:
  fitexa_mysql_data:
  fitexa_machine_images:
