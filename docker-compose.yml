services:
  mysql:
    image: mysql:8.4
    container_name: fitexa-mysql
    restart: unless-stopped
    command: ["mysqld", "--init-file=/docker-entrypoint-initdb.d/00-reset-and-seed.sql"]
    environment:
      MYSQL_DATABASE: fitexa
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - fitexa_mysql_data:/var/lib/mysql
      - ./apps/fitexa/docker/mysql/reset-and-seed.sql:/docker-entrypoint-initdb.d/00-reset-and-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  fitexa:
    build:
      context: ./apps/fitexa
      dockerfile: Dockerfile
    container_name: fitexa-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/fitexa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      MACHINE_IMAGES_DIR: /app/data/machine-images
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PUBLIC_BASE_URL: ${MP_PUBLIC_BASE_URL:-http://localhost:8080}
      MP_MOBILE_BASE_URL: ${MP_MOBILE_BASE_URL:-http://localhost:8100}
    ports:
      - "8080:8080"
    volumes:
      - fitexa_machine_images:/app/data/machine-images

  admin-panel:
    build:
      context: ./apps/admin-panel
      dockerfile: Dockerfile
    container_name: gym-admin-panel
    restart: unless-stopped
    depends_on:
      - fitexa
    ports:
      - "4200:80"

  mobile-app:
    build:
      context: ./apps/mobile-app
      dockerfile: Dockerfile
    container_name: gym-mobile-app
    restart: unless-stopped
    depends_on:
      - fitexa
    ports:
      - "8100:80"

volumes:
  fitexa_mysql_data:
  fitexa_machine_images:
