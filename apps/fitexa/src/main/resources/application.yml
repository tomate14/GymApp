server:
  port: 8080

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fitexa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
      continue-on-error: false

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

fitexa:
  storage:
    machine-images-dir: ${MACHINE_IMAGES_DIR:/app/data/machine-images}
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN:}
    public-base-url: ${MP_PUBLIC_BASE_URL:http://localhost:8080}
    mobile-base-url: ${MP_MOBILE_BASE_URL:http://localhost:8100}
  security:
    jwt:
      secret: ${JWT_SECRET:fitexa-default-jwt-secret-key-change-this-in-production-2026}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
