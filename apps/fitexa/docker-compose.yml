services:
  mysql:
    image: mysql:8.4
    container_name: fitexa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitexa
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: ["/bin/sh", "/fitexa-bootstrap/bootstrap.sh"]
    volumes:
      - fitexa_mysql_data:/var/lib/mysql
      - ./docker/mysql:/fitexa-bootstrap:ro

volumes:
  fitexa_mysql_data:
