services:
  mysql:
    image: mysql:8.4
    container_name: fitexa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fitexa
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: ["mysqld", "--init-file=/docker-entrypoint-initdb.d/00-bootstrap.sql"]
    volumes:
      - fitexa_mysql_data:/var/lib/mysql
      - ./docker/mysql/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro

volumes:
  fitexa_mysql_data:
