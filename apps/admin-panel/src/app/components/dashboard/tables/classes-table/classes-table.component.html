<section class="admin-card">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h2 class="section-title mb-0">Agenda de clases</h2>
      <small class="text-secondary">Planificacion semanal</small>
    </div>
    <div class="week-nav">
      <button class="btn btn-sm btn-outline-light" type="button" (click)="onPreviousWeek()">Anterior</button>
      <span class="week-label">{{ weekRangeLabel }}</span>
      <button class="btn btn-sm btn-outline-light" type="button" (click)="onNextWeek()">Siguiente</button>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-12 col-md-4">
      <label class="form-label form-label-sm">Clase</label>
      <input class="form-control form-control-sm" type="text" [(ngModel)]="filters.search" (ngModelChange)="onFiltersChanged()" />
    </div>
    <div class="col-12 col-md-3">
      <label class="form-label form-label-sm">Actividad</label>
      <select class="form-select form-select-sm" [(ngModel)]="filters.activityId" (ngModelChange)="onFiltersChanged()">
        <option [ngValue]="0">Todas</option>
        <option *ngFor="let activity of activities" [ngValue]="activity.id">{{ activity.name }}</option>
      </select>
    </div>
    <div class="col-12 col-md-3">
      <label class="form-label form-label-sm">Profesor</label>
      <select class="form-select form-select-sm" [(ngModel)]="filters.teacherId" (ngModelChange)="onFiltersChanged()">
        <option [ngValue]="0">Todos</option>
        <option *ngFor="let teacher of teachers" [ngValue]="teacher.id">{{ teacher.firstName }} {{ teacher.lastName }}</option>
      </select>
    </div>
    <div class="col-12 col-md-2 d-flex align-items-end">
      <button class="btn btn-sm btn-outline-light w-100" type="button" (click)="onClearFilters()">Limpiar</button>
    </div>
  </div>

  <div class="d-flex align-items-center gap-2 mb-2" *ngIf="isLoading">
    <div class="spinner-border spinner-border-sm text-light" role="status" aria-hidden="true"></div>
    <small class="text-secondary">Cargando clases...</small>
  </div>

  <div class="table-responsive calendar-wrapper" *ngIf="allDayCells.length > 0 || calendarRows.length > 0">
    <table class="table table-dark align-top weekly-calendar-table">
      <thead>
        <tr>
          <th class="time-col">Hora</th>
          <th *ngFor="let day of weekDays">
            <div class="day-header">
              <small>{{ day.shortLabel }}</small>
              <strong>{{ day.dayNumber }}</strong>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr class="all-day-row" *ngIf="allDayCells.length > 0">
          <th class="time-col">Todo el dia</th>
          <td *ngFor="let cell of allDayCells">
            <div class="slot-events slot-events-all-day" *ngIf="cell.classes.length > 0; else emptyAllDaySlot">
              <div
                class="calendar-event"
                [class.calendar-event-expanded]="isExpanded(item)"
                *ngFor="let item of cell.classes"
              >
                <button class="calendar-event-toggle" type="button" (click)="toggleEvent(item)">
                  <h3 class="event-title">{{ item.className }}</h3>
                  <small class="event-meta">{{ item.teacherName }}</small>
                  <ng-container *ngIf="isExpanded(item)">
                    <small class="event-meta">{{ item.activityName }}</small>
                    <small class="event-meta">{{ scheduleLine(item) }}</small>
                    <span class="occupancy-chip" [ngClass]="occupancyClass(item)">
                      {{ item.occupancyPercent | number: '1.0-0' }}%
                    </span>
                  </ng-container>
                </button>
                <ng-container *ngIf="isExpanded(item)">
                  <button class="btn btn-sm btn-outline-light attendance-button" type="button" (click)="openAttendance(item, $event)">
                    Tomar asistencia
                  </button>
                </ng-container>
              </div>
            </div>
            <ng-template #emptyAllDaySlot>
              <span class="empty-slot">-</span>
            </ng-template>
          </td>
        </tr>

        <tr *ngFor="let row of calendarRows">
          <th class="time-col">{{ row.time }}</th>
          <td *ngFor="let cell of row.cells">
            <div class="slot-events" *ngIf="cell.classes.length > 0; else emptySlot">
              <div
                class="calendar-event"
                [class.calendar-event-expanded]="isExpanded(item)"
                *ngFor="let item of cell.classes"
              >
                <button class="calendar-event-toggle" type="button" (click)="toggleEvent(item)">
                  <h3 class="event-title">{{ item.className }}</h3>
                  <small class="event-meta">{{ item.teacherName }}</small>
                  <ng-container *ngIf="isExpanded(item)">
                    <small class="event-meta">{{ item.activityName }}</small>
                    <small class="event-meta">{{ scheduleLine(item) }}</small>
                    <span class="occupancy-chip" [ngClass]="occupancyClass(item)">
                      {{ item.occupancyPercent | number: '1.0-0' }}%
                    </span>
                  </ng-container>
                </button>
                <ng-container *ngIf="isExpanded(item)">
                  <button class="btn btn-sm btn-outline-light attendance-button" type="button" (click)="openAttendance(item, $event)">
                    Tomar asistencia
                  </button>
                </ng-container>
              </div>
            </div>
            <ng-template #emptySlot>
              <span class="empty-slot">-</span>
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="empty-state mb-0" *ngIf="!isLoading && calendarRows.length === 0 && allDayCells.length === 0">
    Sin clases programadas para esta semana.
  </p>
</section>

<app-class-attendance-popup
  [visible]="attendancePopupVisible"
  [attendance]="attendanceData"
  [isLoading]="isLoadingAttendance"
  [isSaving]="isSavingAttendance"
  [error]="attendanceError"
  (closed)="closeAttendancePopup()"
  (saved)="saveAttendance($event)"
></app-class-attendance-popup>
