<div class="change-password-layout">
  <section class="change-password-card">
    <p class="eyebrow mb-1">Primer ingreso</p>
    <h1 class="mb-2">Cambia tu contrasena</h1>
    <p class="text-secondary mb-3">
      Por seguridad, debes actualizar la contrasena inicial antes de continuar.
    </p>

    <form class="d-grid gap-3" (ngSubmit)="submit()">
      <div>
        <label class="form-label form-label-sm">Contrasena actual</label>
        <input
          class="form-control form-control-lg"
          type="password"
          name="currentPassword"
          [(ngModel)]="currentPassword"
          [disabled]="isSubmitting"
          required
        />
      </div>

      <div>
        <label class="form-label form-label-sm">Nueva contrasena</label>
        <input
          class="form-control form-control-lg"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          [disabled]="isSubmitting"
          required
        />
      </div>

      <div>
        <label class="form-label form-label-sm">Confirmar nueva contrasena</label>
        <input
          class="form-control form-control-lg"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          [disabled]="isSubmitting"
          required
        />
      </div>

      <div class="alert alert-danger py-2 px-3 mb-0" role="alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="alert alert-success py-2 px-3 mb-0" role="alert" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button class="btn btn-brand btn-lg" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Guardando...' : 'Actualizar contrasena' }}
      </button>
    </form>
  </section>
</div>
