<div class="popup-overlay" *ngIf="visible" (click)="closed.emit()"></div>

<section class="popup-window card border-light-subtle bg-black text-light" *ngIf="visible" role="dialog" aria-modal="true">
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h5 class="card-title mb-1">Rutina personalizada</h5>
        <small class="text-secondary">Selecciona los ejercicios que queres cargar para este alumno.</small>
      </div>
      <button class="btn btn-sm btn-outline-light" type="button" (click)="closed.emit()">Cerrar</button>
    </div>

    <div class="mb-3">
      <label class="form-label form-label-sm">Buscar ejercicio</label>
      <input
        class="form-control form-control-sm"
        type="text"
        name="customRoutineExerciseSearch"
        [(ngModel)]="searchTerm"
        placeholder="Buscar por nombre"
      />
    </div>

    <div class="exercise-list" *ngIf="filteredExercises.length > 0; else noExercises">
      <label class="exercise-row" *ngFor="let exercise of filteredExercises">
        <div class="form-check m-0">
          <input
            class="form-check-input"
            type="checkbox"
            [checked]="isSelected(exercise.id)"
            (change)="toggleExercise(exercise.id, $any($event.target).checked)"
          />
        </div>
        <span class="exercise-name">{{ exercise.name }}</span>
      </label>
    </div>

    <ng-template #noExercises>
      <p class="empty-state mb-0">No hay ejercicios disponibles para la busqueda actual.</p>
    </ng-template>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
      <small class="text-secondary">{{ draftSelection.size }} ejercicio(s) seleccionado(s)</small>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-light" type="button" (click)="closed.emit()">Cancelar</button>
        <button class="btn btn-sm btn-brand" type="button" [disabled]="draftSelection.size === 0" (click)="confirm()">
          Aplicar seleccion
        </button>
      </div>
    </div>
  </div>
</section>
