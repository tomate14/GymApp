<ion-app>
  <ion-header translucent="true">
    <ion-toolbar>
      <ion-title>GymApp</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" class="home-content">
    <section class="hero">
      <p class="eyebrow">Tu progreso</p>
      <h1>Modo Beast Activado</h1>
      <p class="subtitle">Rutina personalizada para ganar fuerza y mantener constancia.</p>
      <div class="chips">
        <ion-chip>
          <ion-icon name="flash-outline"></ion-icon>
          <span>Racha: 9 dias</span>
        </ion-chip>
        <ion-chip>
          <ion-icon name="trophy-outline"></ion-icon>
          <span>Nivel: Intermedio</span>
        </ion-chip>
      </div>
      <ion-button expand="block" class="cta">Empezar entrenamiento</ion-button>
    </section>

    <ion-card class="stats-card">
      <ion-card-header>
        <ion-card-subtitle>Objetivo semanal</ion-card-subtitle>
        <ion-card-title>3 / 5 sesiones</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-progress-bar value="0.6"></ion-progress-bar>
      </ion-card-content>
    </ion-card>

    <ion-card class="routine-card">
      <ion-card-header>
        <ion-card-title>Tu plan</ion-card-title>
        <ion-card-subtitle>Proximos entrenamientos</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <article class="routine-row" *ngFor="let routine of routines">
          <ion-icon name="barbell-outline"></ion-icon>
          <div>
            <strong>{{ routine.day }}</strong>
            <p>{{ routine.name }}</p>
          </div>
          <small>{{ routine.status }}</small>
        </article>
      </ion-card-content>
    </ion-card>
  </ion-content>
</ion-app>
