<ion-content [fullscreen]="true" class="change-password-screen">
  <div class="change-password-layout">
    <ion-card class="change-password-card">
      <ion-card-content>
        <p class="eyebrow">Primer ingreso</p>
        <h1>Cambia tu password</h1>
        <p class="subtitle">Antes de seguir, define una clave propia para proteger tu cuenta.</p>

        <form class="change-password-form" (ngSubmit)="submit()">
          <ion-input
            type="password"
            label="Password actual"
            labelPlacement="stacked"
            [(ngModel)]="currentPassword"
            name="currentPassword"
          ></ion-input>

          <ion-input
            type="password"
            label="Nueva password"
            labelPlacement="stacked"
            [(ngModel)]="newPassword"
            name="newPassword"
          ></ion-input>

          <ion-input
            type="password"
            label="Confirmar nueva password"
            labelPlacement="stacked"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
          ></ion-input>

          <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

          <ion-button expand="block" type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Guardando...' : 'Actualizar password' }}
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
